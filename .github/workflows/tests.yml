name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install the package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Install JS helpers
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: confidence_scorer/js_helpers

      - name: Tests
        run: pytest -q --cov=confidence_scorer --cov-report=term-missing --cov-report=xml

      - name: Check that js_helpers are packaged
        shell: bash
        run: |
          set -euo pipefail
          pip install build
          python -m build --wheel -o dist_check
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist_check/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          missing = [
              f
              for f in ("extract.js", "diff_worker.js", "spec_to_arbitrary.js", "package.json")
              if f"confidence_scorer/js_helpers/{f}" not in names
          ]
          if missing:
              sys.exit(f"js_helpers files missing from the wheel: {missing}")
          print("js_helpers are fully packaged")
          PY

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "ruff>=0.6"
      - run: ruff check confidence_scorer tests
