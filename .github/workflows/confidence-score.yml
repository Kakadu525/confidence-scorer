name: Confidence Score

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # обязательно: без полной истории не сравнить base...head

      - name: Confidence Scorer
        uses: ./
        with:
          post-comment: "false"
          # Ключи задаются в Settings -> Secrets and variables -> Actions.
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Сохранить номер PR
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s\n' "$PR_NUMBER" > pr-number.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confidence-report
          path: |
            report.md
            pr-number.txt
          if-no-files-found: ignore
          retention-days: 7
