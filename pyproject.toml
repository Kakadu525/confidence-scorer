[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confidence-scorer"
version = "0.1.0"
description = "Confidence score for AI-generated PRs and diffs: differential property-based tests, AI semantic diff and an independent AI reviewer before merge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dima" }]
keywords = ["code-review", "property-based-testing", "ai", "ci", "differential-testing", "llm", "hypothesis", "github-actions", "pull-requests"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "PyYAML>=6.0",
    "pydantic>=2.6",
    "hypothesis>=6.100",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.34", "openai>=1.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Kakadu525/confidence-scorer"
Repository = "https://github.com/Kakadu525/confidence-scorer"
Issues = "https://github.com/Kakadu525/confidence-scorer/issues"

[project.scripts]
confidence-score = "confidence_scorer.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["confidence_scorer*"]

[tool.setuptools.package-data]
confidence_scorer = [
    "js_helpers/*.js",
    "js_helpers/package.json",
    "js_helpers/package-lock.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["confidence_scorer"]
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "ARG", "SIM", "RUF", "BLE", "S"]
ignore = [
    "E501",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
    "S404",
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"confidence_scorer/checks/_diff_worker.py" = ["S102", "BLE001"]
"tests/*" = ["ARG001", "ARG002", "S101"]
