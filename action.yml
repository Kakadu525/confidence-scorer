name: "Confidence Scorer"
description: >-
  Оценка уверенности для AI-сгенерированных PR: differential property-based
  тесты, semantic diff и независимый AI-ревьюер перед мержем.
branding:
  icon: "shield"
  color: "purple"

inputs:
  python-version:
    description: "Версия Python для установки confidence-scorer"
    default: "3.12"
  node-version:
    description: "Версия Node.js для JS/TS property-тестов"
    default: "24"
  base-ref:
    description: "Базовый ref для сравнения (по умолчанию base ветки PR)"
    default: ""
  config-path:
    description: "Путь к confidence.yml (по умолчанию ищется в репозитории)"
    default: ""
  fail-under:
    description: "Переопределить порог thresholds.fail_below из конфига"
    default: ""
  fail-on-gate:
    description: "Падать, если сработал merge gate. С \"false\" Action только сообщает результат в outputs score, verdict и gate"
    default: "true"
  post-comment:
    description: "Публиковать/обновлять комментарий с отчётом в PR"
    default: "true"
  github-token:
    description: "Токен для публикации комментария в PR"
    default: ${{ github.token }}
  anthropic-api-key:
    description: "ANTHROPIC_API_KEY (нужен, если хотя бы одна проверка использует provider: anthropic)"
    default: ""
  openai-api-key:
    description: "OPENAI_API_KEY (нужен, если хотя бы одна проверка использует provider: openai)"
    default: ""
  openrouter-api-key:
    description: "OPENROUTER_API_KEY (provider: openrouter; модели с суффиксом :free бесплатны)"
    default: ""
  deepseek-api-key:
    description: "DEEPSEEK_API_KEY (provider: deepseek)"
    default: ""
  dashscope-api-key:
    description: "DASHSCOPE_API_KEY (provider: qwen)"
    default: ""

outputs:
  score:
    description: "Итоговый confidence score (0-100), либо пусто, если ни одна проверка не смогла отработать"
    value: ${{ steps.run.outputs.score }}
  verdict:
    description: "pass | warn | manual | fail | hard_fail | unknown"
    value: ${{ steps.run.outputs.verdict }}
  gate:
    description: "passed | failed: сработал ли merge gate"
    value: ${{ steps.run.outputs.gate }}

runs:
  using: "composite"
  steps:
    - name: Проверить полноту истории git
      shell: bash
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error::Репозиторий выгружен мелко (shallow). Добавьте 'fetch-depth: 0' в actions/checkout: confidence-scorer нужна полная история для сравнения base/head."
          exit 1
        fi

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Установить confidence-scorer
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        ROOT="$ACTION_PATH"
        PKG_ROOT=""
        for _ in 1 2 3 4 5; do
          if [ -f "$ROOT/pyproject.toml" ] && grep -q 'name = "confidence-scorer"' "$ROOT/pyproject.toml"; then
            PKG_ROOT="$ROOT"
            break
          fi
          ROOT="$(dirname "$ROOT")"
        done

        if [ -z "$PKG_ROOT" ]; then
          echo "::error::Не найден pyproject.toml confidence-scorer рядом с action ($ACTION_PATH)."
          exit 1
        fi
        pip install "$PKG_ROOT"

    - name: Установить зависимости JS-хелперов (для JS/TS property-тестов)
      shell: bash
      env:
        PYTHONUTF8: "1"
        PYTHONIOENCODING: utf-8
      run: |
        set -euo pipefail
        PKG_DIR=$(python -c "import confidence_scorer, os; print(os.path.dirname(confidence_scorer.__file__))")
        echo "PKG_DIR=$PKG_DIR" >> "$GITHUB_ENV"
        if [ -f "$PKG_DIR/js_helpers/package.json" ]; then
          (cd "$PKG_DIR/js_helpers" && npm install --omit=dev --no-audit --no-fund)
        else
          echo "::warning::js_helpers не найдены в установленном пакете, JS/TS property-тесты будут пропущены."
        fi

    - name: Определить base ref
      id: base
      shell: bash
      env:
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_BASE_REF" ]; then
          REF="$INPUT_BASE_REF"
        elif [ -n "$PR_BASE_SHA" ]; then
          REF="$PR_BASE_SHA"
        elif [ -n "$PUSH_BEFORE_SHA" ] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
          REF="$PUSH_BEFORE_SHA"
        elif git rev-parse -q --verify "HEAD~1^{commit}" >/dev/null; then
          REF="HEAD~1"
        else
          REF=""
        fi
        printf 'ref=%s\n' "$REF" >> "$GITHUB_OUTPUT"

    - name: Прогнать confidence-score
      id: run
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        DEEPSEEK_API_KEY: ${{ inputs.deepseek-api-key }}
        DASHSCOPE_API_KEY: ${{ inputs.dashscope-api-key }}
        BASE_REF: ${{ steps.base.outputs.ref }}
        HEAD_SHA: ${{ github.sha }}
        CONFIG_PATH: ${{ inputs.config-path }}
        FAIL_UNDER: ${{ inputs.fail-under }}
        PYTHONUTF8: "1"
        PYTHONIOENCODING: utf-8
      run: |
        set -uo pipefail
        if [ -z "$BASE_REF" ]; then
          echo "::notice::Не с чем сравнивать: у коммита нет родителя. Проверка пропущена."
          {
            echo "score="
            echo "verdict=unknown"
            echo "exit_code=0"
            echo "gate=passed"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        ARGS=(--base "$BASE_REF" --head "$HEAD_SHA"
              --json-out score.json --markdown-out report.md --format terminal)
        if [ -n "$CONFIG_PATH" ]; then ARGS+=(--config "$CONFIG_PATH"); fi
        if [ -n "$FAIL_UNDER" ]; then ARGS+=(--fail-under "$FAIL_UNDER"); fi

        RUN_EXIT=0
        confidence-score run "${ARGS[@]}" || RUN_EXIT=$?

        if [ ! -f score.json ]; then
          echo "::error::confidence-score завершился с кодом $RUN_EXIT и не создал score.json, смотрите вывод шага выше."
          exit "${RUN_EXIT:-1}"
        fi

        SCORE=$(python -c "import json;v=json.load(open('score.json'))['score']['overall'];print('' if v is None else v)")
        VERDICT=$(python -c "import json;print(json.load(open('score.json'))['score']['verdict'])")
        printf 'score=%s\n' "$SCORE" >> "$GITHUB_OUTPUT"
        printf 'verdict=%s\n' "$VERDICT" >> "$GITHUB_OUTPUT"
        printf 'exit_code=%s\n' "$RUN_EXIT" >> "$GITHUB_OUTPUT"
        if [ "$RUN_EXIT" -eq 0 ]; then GATE=passed; else GATE=failed; fi
        printf 'gate=%s\n' "$GATE" >> "$GITHUB_OUTPUT"

    - name: Опубликовать/обновить комментарий в PR
      if: ${{ inputs.post-comment == 'true' && github.event.pull_request }}
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          if (!fs.existsSync('report.md')) {
            core.warning('report.md не создан, комментарий в PR не публикуется.');
            return;
          }
          const body = fs.readFileSync('report.md', 'utf8').slice(0, 65000);
          const marker = '<!-- confidence-scorer:report -->';
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          try {
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
          } catch (error) {
            if (error.status === 403 || error.status === 404) {
              core.warning(
                'Нет прав на комментарий в PR (так бывает в PR из форков). ' +
                'Используйте post-comment: "false" и workflow confidence-comment.yml из README confidence-scorer.'
              );
            } else {
              throw error;
            }
          }

    - name: Применить merge gate
      shell: bash
      env:
        RUN_EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        FAIL_ON_GATE: ${{ inputs.fail-on-gate }}
      run: |
        CODE="${RUN_EXIT_CODE:-1}"
        if [ "$CODE" != "0" ] && [ "$FAIL_ON_GATE" = "false" ]; then
          echo "::warning::Merge gate сработал, но fail-on-gate: false, поэтому шаг не падает."
          exit 0
        fi
        exit "$CODE"
