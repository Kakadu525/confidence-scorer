name: "Confidence Scorer"
description: >-
  Оценка уверенности для AI-сгенерированных PR: differential property-based
  тесты, semantic diff и независимый AI-ревьюер перед мержем.
branding:
  icon: "shield"
  color: "purple"

inputs:
  python-version:
    description: "Версия Python для установки confidence-scorer"
    default: "3.11"
  node-version:
    description: "Версия Node.js для JS/TS property-тестов"
    default: "20"
  base-ref:
    description: "Базовый ref для сравнения (по умолчанию base ветки PR)"
    default: ""
  config-path:
    description: "Путь к confidence.yml (по умолчанию ищется в репозитории)"
    default: ""
  fail-under:
    description: "Переопределить порог thresholds.fail_below из конфига"
    default: ""
  post-comment:
    description: "Публиковать/обновлять комментарий с отчётом в PR"
    default: "true"
  github-token:
    description: "Токен для публикации комментария в PR"
    default: ${{ github.token }}
  anthropic-api-key:
    description: "ANTHROPIC_API_KEY (нужен, если хотя бы одна проверка использует provider: anthropic)"
    default: ""
  openai-api-key:
    description: "OPENAI_API_KEY (нужен, если хотя бы одна проверка использует provider: openai)"
    default: ""
  openrouter-api-key:
    description: "OPENROUTER_API_KEY (provider: openrouter; модели с суффиксом :free бесплатны)"
    default: ""
  deepseek-api-key:
    description: "DEEPSEEK_API_KEY (provider: deepseek)"
    default: ""
  dashscope-api-key:
    description: "DASHSCOPE_API_KEY (provider: qwen)"
    default: ""

outputs:
  score:
    description: "Итоговый confidence score (0-100), либо пусто, если ни одна проверка не смогла отработать"
    value: ${{ steps.run.outputs.score }}
  verdict:
    description: "pass | warn | manual | fail | hard_fail | unknown"
    value: ${{ steps.run.outputs.verdict }}

runs:
  using: "composite"
  steps:
    - name: Проверить полноту истории git
      shell: bash
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error::Репозиторий выгружен мелко (shallow). Добавьте 'fetch-depth: 0' в actions/checkout: confidence-scorer нужна полная история для сравнения base/head."
          exit 1
        fi

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Установить confidence-scorer
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        ROOT="$ACTION_PATH"
        PKG_ROOT=""
        for _ in 1 2 3 4 5; do
          if [ -f "$ROOT/pyproject.toml" ] && grep -q 'name = "confidence-scorer"' "$ROOT/pyproject.toml"; then
            PKG_ROOT="$ROOT"
            break
          fi
          ROOT="$(dirname "$ROOT")"
        done

        if [ -n "$PKG_ROOT" ]; then
          echo "Устанавливаю confidence-scorer из исходников: $PKG_ROOT"
          pip install "$PKG_ROOT"
        else
          echo "Исходники рядом с action не найдены, ставлю опубликованный пакет"
          pip install confidence-scorer
        fi

    - name: Установить зависимости JS-хелперов (для JS/TS property-тестов)
      shell: bash
      run: |
        set -euo pipefail
        PKG_DIR=$(python -c "import confidence_scorer, os; print(os.path.dirname(confidence_scorer.__file__))")
        echo "PKG_DIR=$PKG_DIR" >> "$GITHUB_ENV"
        if [ -f "$PKG_DIR/js_helpers/package.json" ]; then
          (cd "$PKG_DIR/js_helpers" && npm install --omit=dev --no-audit --no-fund)
        else
          echo "::warning::js_helpers не найдены в установленном пакете, JS/TS property-тесты будут пропущены."
        fi

    - name: Определить base ref
      id: base
      shell: bash
      env:
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_BASE_REF" ]; then
          REF="$INPUT_BASE_REF"
        elif [ -n "$PR_BASE_SHA" ]; then
          REF="$PR_BASE_SHA"
        else
          REF="HEAD~1"
        fi
        printf 'ref=%s\n' "$REF" >> "$GITHUB_OUTPUT"

    - name: Прогнать confidence-score
      id: run
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        DEEPSEEK_API_KEY: ${{ inputs.deepseek-api-key }}
        DASHSCOPE_API_KEY: ${{ inputs.dashscope-api-key }}
        BASE_REF: ${{ steps.base.outputs.ref }}
        HEAD_SHA: ${{ github.sha }}
        CONFIG_PATH: ${{ inputs.config-path }}
        FAIL_UNDER: ${{ inputs.fail-under }}
      run: |
        set -uo pipefail
        ARGS=(--base "$BASE_REF" --head "$HEAD_SHA"
              --json-out score.json --markdown-out report.md --format terminal)
        if [ -n "$CONFIG_PATH" ]; then ARGS+=(--config "$CONFIG_PATH"); fi
        if [ -n "$FAIL_UNDER" ]; then ARGS+=(--fail-under "$FAIL_UNDER"); fi

        confidence-score run "${ARGS[@]}"
        RUN_EXIT=$?

        if [ ! -f score.json ]; then
          echo "::error::confidence-score завершился с кодом $RUN_EXIT и не создал score.json, смотрите вывод шага выше."
          exit "${RUN_EXIT:-1}"
        fi

        SCORE=$(python -c "import json;v=json.load(open('score.json'))['score']['overall'];print('' if v is None else v)")
        VERDICT=$(python -c "import json;print(json.load(open('score.json'))['score']['verdict'])")
        printf 'score=%s\n' "$SCORE" >> "$GITHUB_OUTPUT"
        printf 'verdict=%s\n' "$VERDICT" >> "$GITHUB_OUTPUT"
        printf 'exit_code=%s\n' "$RUN_EXIT" >> "$GITHUB_OUTPUT"

    - name: Опубликовать/обновить комментарий в PR
      if: ${{ inputs.post-comment == 'true' && github.event.pull_request }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          if (!fs.existsSync('report.md')) {
            core.warning('report.md не создан, комментарий в PR не публикуется.');
            return;
          }
          const body = fs.readFileSync('report.md', 'utf8');
          const marker = '<!-- confidence-scorer:report -->';
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find((c) => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Применить merge gate
      shell: bash
      env:
        RUN_EXIT_CODE: ${{ steps.run.outputs.exit_code }}
      run: exit "${RUN_EXIT_CODE:-1}"
