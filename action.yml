name: "Confidence Scorer"
description: >-
  Confidence score for AI-generated PRs: property-based tests,
  semantic diff and an independent AI reviewer before merge
branding:
  icon: "shield"
  color: "purple"

inputs:
  python-version:
    description: "Python version to install confidence-scorer with"
    default: "3.12"
  node-version:
    description: "Node.js version for JS/TS property tests"
    default: "24"
  base-ref:
    description: "Base ref to compare against (default: the PR base branch)"
    default: ""
  config-path:
    description: "Path to confidence.yml (default: looked up in the repository)"
    default: ""
  fail-under:
    description: "Override thresholds.fail_below from the config"
    default: ""
  language:
    description: "Report and PR comment language: en | ru (default: `language:` from confidence.yml, otherwise en)"
    default: ""
  fail-on-gate:
    description: "Fail when the merge gate triggers. With \"false\" the Action only reports the result in the score, verdict and gate outputs"
    default: "true"
  post-comment:
    description: "Post or update a PR comment with the report"
    default: "true"
  github-token:
    description: "Token used to post the PR comment"
    default: ${{ github.token }}
  anthropic-api-key:
    description: "ANTHROPIC_API_KEY (needed if at least one check uses provider: anthropic)"
    default: ""
  openai-api-key:
    description: "OPENAI_API_KEY (needed if at least one check uses provider: openai)"
    default: ""
  openrouter-api-key:
    description: "OPENROUTER_API_KEY (provider: openrouter; models with the :free suffix cost nothing)"
    default: ""
  deepseek-api-key:
    description: "DEEPSEEK_API_KEY (provider: deepseek)"
    default: ""
  dashscope-api-key:
    description: "DASHSCOPE_API_KEY (provider: qwen)"
    default: ""

outputs:
  score:
    description: "Final confidence score (0-100), or empty if no check was able to run"
    value: ${{ steps.run.outputs.score }}
  verdict:
    description: "pass | warn | manual | fail | hard_fail | unknown"
    value: ${{ steps.run.outputs.verdict }}
  gate:
    description: "passed | failed: whether the merge gate triggered"
    value: ${{ steps.run.outputs.gate }}

runs:
  using: "composite"
  steps:
    - name: Check that git history is complete
      shell: bash
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error::The repository is a shallow clone. Add 'fetch-depth: 0' to actions/checkout: confidence-scorer needs the full history to compare base/head."
          exit 1
        fi

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Install confidence-scorer
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        ROOT="$ACTION_PATH"
        PKG_ROOT=""
        for _ in 1 2 3 4 5; do
          if [ -f "$ROOT/pyproject.toml" ] && grep -q 'name = "confidence-scorer"' "$ROOT/pyproject.toml"; then
            PKG_ROOT="$ROOT"
            break
          fi
          ROOT="$(dirname "$ROOT")"
        done

        if [ -z "$PKG_ROOT" ]; then
          echo "::error::confidence-scorer pyproject.toml not found next to the action ($ACTION_PATH)."
          exit 1
        fi
        pip install "$PKG_ROOT"

    - name: Install JS helper dependencies (for JS/TS property tests)
      shell: bash
      env:
        PYTHONUTF8: "1"
        PYTHONIOENCODING: utf-8
      run: |
        set -euo pipefail
        PKG_DIR=$(python -c "import confidence_scorer, os; print(os.path.dirname(confidence_scorer.__file__))")
        echo "PKG_DIR=$PKG_DIR" >> "$GITHUB_ENV"
        if [ -f "$PKG_DIR/js_helpers/package.json" ]; then
          (cd "$PKG_DIR/js_helpers" && npm install --omit=dev --no-audit --no-fund)
        else
          echo "::warning::js_helpers not found in the installed package, JS/TS property tests will be skipped."
        fi

    - name: Determine the base ref
      id: base
      shell: bash
      env:
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_BASE_REF" ]; then
          REF="$INPUT_BASE_REF"
        elif [ -n "$PR_BASE_SHA" ]; then
          REF="$PR_BASE_SHA"
        elif [ -n "$PUSH_BEFORE_SHA" ] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
          REF="$PUSH_BEFORE_SHA"
        elif git rev-parse -q --verify "HEAD~1^{commit}" >/dev/null; then
          REF="HEAD~1"
        else
          REF=""
        fi
        printf 'ref=%s\n' "$REF" >> "$GITHUB_OUTPUT"

    - name: Run confidence-score
      id: run
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        DEEPSEEK_API_KEY: ${{ inputs.deepseek-api-key }}
        DASHSCOPE_API_KEY: ${{ inputs.dashscope-api-key }}
        BASE_REF: ${{ steps.base.outputs.ref }}
        HEAD_SHA: ${{ github.sha }}
        CONFIG_PATH: ${{ inputs.config-path }}
        FAIL_UNDER: ${{ inputs.fail-under }}
        CONFIDENCE_LANG: ${{ inputs.language }}
        PYTHONUTF8: "1"
        PYTHONIOENCODING: utf-8
      run: |
        set -uo pipefail
        if [ -z "$BASE_REF" ]; then
          echo "::notice::Nothing to compare against: the commit has no parent. Check skipped."
          {
            echo "score="
            echo "verdict=unknown"
            echo "exit_code=0"
            echo "gate=passed"
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        ARGS=(--base "$BASE_REF" --head "$HEAD_SHA"
              --json-out score.json --markdown-out report.md --format terminal)
        if [ -n "$CONFIG_PATH" ]; then ARGS+=(--config "$CONFIG_PATH"); fi
        if [ -n "$FAIL_UNDER" ]; then ARGS+=(--fail-under "$FAIL_UNDER"); fi

        RUN_EXIT=0
        confidence-score run "${ARGS[@]}" || RUN_EXIT=$?

        if [ ! -f score.json ]; then
          echo "::error::confidence-score exited with code $RUN_EXIT and did not create score.json, see the step output above."
          exit "${RUN_EXIT:-1}"
        fi

        SCORE=$(python -c "import json;v=json.load(open('score.json'))['score']['overall'];print('' if v is None else v)")
        VERDICT=$(python -c "import json;print(json.load(open('score.json'))['score']['verdict'])")
        printf 'score=%s\n' "$SCORE" >> "$GITHUB_OUTPUT"
        printf 'verdict=%s\n' "$VERDICT" >> "$GITHUB_OUTPUT"
        printf 'exit_code=%s\n' "$RUN_EXIT" >> "$GITHUB_OUTPUT"
        if [ "$RUN_EXIT" -eq 0 ]; then GATE=passed; else GATE=failed; fi
        printf 'gate=%s\n' "$GATE" >> "$GITHUB_OUTPUT"

    - name: Post or update the PR comment
      if: ${{ inputs.post-comment == 'true' && github.event.pull_request }}
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          if (!fs.existsSync('report.md')) {
            core.warning('report.md was not created, the PR comment is not posted.');
            return;
          }
          const body = fs.readFileSync('report.md', 'utf8').slice(0, 65000);
          const marker = '<!-- confidence-scorer:report -->';
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          try {
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
          } catch (error) {
            if (error.status === 403 || error.status === 404) {
              core.warning(
                'No permission to comment on the PR (this happens with PRs from forks). ' +
                'Use post-comment: "false" and the confidence-comment.yml workflow from the confidence-scorer README.'
              );
            } else {
              throw error;
            }
          }

    - name: Apply the merge gate
      shell: bash
      env:
        RUN_EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        FAIL_ON_GATE: ${{ inputs.fail-on-gate }}
      run: |
        CODE="${RUN_EXIT_CODE:-1}"
        if [ "$CODE" != "0" ] && [ "$FAIL_ON_GATE" = "false" ]; then
          echo "::warning::The merge gate triggered, but fail-on-gate is false, so the step does not fail."
          exit 0
        fi
        exit "$CODE"
